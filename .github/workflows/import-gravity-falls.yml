name: Import Gravity Falls from Notion exports
on:
  push:
    paths:
      - ".github/workflows/import-gravity-falls.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Gravity Falls exports
        run: |
          python - <<'PY'
          import zipfile, pathlib, re
          archives = [
              "c497aa96-2df8-4966-9966-b9ca32fbb819_ExportBlock-2f917f1d-b83a-4317-86b7-720234619d94.zip",
              "a18a765f-d0ab-46a5-9c3a-ed562d831790_ExportBlock-4f9b0bff-67f4-4637-8eb4-c96dd693184a.zip",
          ]
          base = pathlib.Path("Kampagnen/Main 1/Gravity Falls")
          base.mkdir(parents=True, exist_ok=True)
          copied = []
          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      name = info.filename.replace("\\", "/")
                      if not name.startswith("Private & Shared/"):
                          continue
                      rel = pathlib.PurePosixPath(name).relative_to("Private & Shared")
                      target = base.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(info.filename))
                      copied.append((str(target), rel.suffix.lower()))
          md = sorted(p for p, ext in copied if ext == ".md")
          media = sorted(p for p, ext in copied if ext in {".jpg",".jpeg",".png",".webp",".avif",".pdf"})
          index = """---
          title: Gravity Falls
          ---
          
          # Gravity Falls
          
          ## Kampagnen- und Sitzungsnotizen
          
          - [Endgame](Endgame%2025bcb8222608801fafdeef8f8ad8ee27)
          - [Session Endelyn](Session%20Endelyn%20243cb8222608809ab64fdd1e0e83d150)
          
          Die zugehörigen Charakter-, Orts- und Sitzungsseiten sowie Medien liegen in den jeweiligen Unterordnern.
          """
          (base / "index.md").write_text(index, encoding="utf-8")
          print(f"Imported markdown: {len(md)}")
          print(f"Imported media/PDF: {len(media)}")
          for p, _ in copied:
              print("IMPORTED " + p)
          PY
      - name: Commit imported notes and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Kampagnen/Main 1/Gravity Falls"
          git commit -m "Import Gravity Falls campaign notes and attachments"
          git push
