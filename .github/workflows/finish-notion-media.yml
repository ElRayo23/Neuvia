name: Finish Notion media import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-notion-media.yml"

permissions:
  contents: write
  actions: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the Phandelver overview map
        run: |
          mkdir -p "Lore/Anhänge/Orte/Phandelver"
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("36824d5c-819a-45a6-9b54-ca8f97731daa_ExportBlock-541f3eff-8820-4691-80dc-3e845a634b53.zip")
          matches = [n for n in z.namelist() if n.rsplit("/", 1)[-1] == "3f317226845207.5635b51ebf59f.jpg"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one map image, found {len(matches)}")
          with open("Lore/Anhänge/Orte/Phandelver/3f317226845207.5635b51ebf59f.jpg", "wb") as out:
              out.write(z.read(matches[0]))
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path("Lore/Phandelver – Orte.md")
          s = p.read_text(encoding="utf-8")
          marker = "> **Notion-Anhang:** Eine zusätzliche Kartenabbildung ist in der [Originalnotiz in Notion](https://app.notion.com/p/18f60f7443dc80088f46ff317fd164d0) eingebettet und wurde nicht nach GitHub kopiert."
          s = s.replace(marker, "![Phandelver-Karte](<Anhänge/Orte/Phandelver/3f317226845207.5635b51ebf59f.jpg>)")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/finish-notion-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add remaining Phandelver map attachment"
          git push origin main
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ElRayo23/Neuvia/actions/workflows/deploy-quartz.yml/dispatches \
            -d '{"ref":"main"}'
