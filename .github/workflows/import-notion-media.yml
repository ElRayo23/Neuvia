name: Import Notion media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-notion-media.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract media and link it to notes
        run: |
          python - <<'PY'
          import os, re, zipfile, tempfile, shutil, unicodedata, subprocess
          from pathlib import Path

          root = Path(".")
          zip_files = sorted(root.glob("*_ExportBlock-*.zip"))
          if len(zip_files) != 5:
              raise SystemExit(f"Expected 5 Notion export ZIPs, found {len(zip_files)}")

          def norm(s):
              s = unicodedata.normalize("NFKD", s).casefold()
              s = "".join(c for c in s if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]", "", s)

          lore_map = {
              "Charaktere": "Lore",
              "Orte": "Lore",
              "Verbindungen": "Lore",
              "Dateien sonstiges": "Lore",
              "Kampagnenverlauf": "Kampagnen/Phandelver",
          }
          root_dest = {
              "Charaktere": "Lore/Phandelver – Charaktere.md",
              "Orte": "Lore/Phandelver – Orte.md",
              "Verbindungen": "Lore/Phandelver – Organisationen.md",
              "Dateien sonstiges": "Lore/Phandelver – Sonstiges.md",
              "Kampagnenverlauf": "Kampagnen/Phandelver/Kampagnenverlauf.md",
          }
          media_ext = {".jpg", ".jpeg", ".png", ".webp", ".avif", ".pdf"}
          md_files = [p for base in ("Lore", "Kampagnen/Phandelver") for p in Path(base).rglob("*.md")]
          by_norm = {norm(p.stem): p for p in md_files}

          def source_title(relparts):
              # relparts starts after Private & Shared/
              category = relparts[0]
              if len(relparts) == 1:
                  return category
              return relparts[1]

          def find_destination(category, title):
              if title == category:
                  p = Path(root_dest[category])
                  return p if p.exists() else None
              folder = Path(lore_map[category])
              target = norm(title)
              matches = [p for p in md_files if p.parent == folder and norm(p.stem) == target]
              if not matches and category == "Kampagnenverlauf":
                  matches = [p for p in md_files if p.parent == folder and (target in norm(p.stem) or norm(p.stem) in target)]
              if not matches and category != "Kampagnenverlauf":
                  matches = [p for p in md_files if p.parent == folder and (target in norm(p.stem) or norm(p.stem) in target)]
              return sorted(matches, key=lambda p: len(p.stem))[0] if matches else None

          imported = 0
          grouped = {}
          skipped = []
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              for z in zip_files:
                  with zipfile.ZipFile(z) as archive:
                      archive.extractall(td / z.stem)
              for base in td.iterdir():
                  for f in base.rglob("*"):
                      if not f.is_file() or f.suffix.lower() not in media_ext:
                          continue
                      parts = f.parts
                      try:
                          ix = parts.index("Private & Shared")
                          rel = parts[ix+1:]
                      except ValueError:
                          continue
                      if not rel or rel[0] not in lore_map:
                          continue
                      category = rel[0]
                      title = source_title(rel)
                      dest_note = find_destination(category, title)
                      if dest_note is None:
                          skipped.append(str(f))
                          continue
                      if category == "Kampagnenverlauf":
                          asset_dir = Path("Kampagnen/Phandelver/Anhänge") / title
                      else:
                          bucket = {"Dateien sonstiges": "Sonstiges"}.get(category, category)
                          asset_dir = Path("Lore/Anhänge") / bucket / title
                      asset_dir.mkdir(parents=True, exist_ok=True)
                      target = asset_dir / f.name
                      if target.exists():
                          if target.read_bytes() != f.read_bytes():
                              target = asset_dir / f"{f.stem}-{abs(hash(f.name))%100000:05d}{f.suffix}"
                      if not target.exists():
                          shutil.copy2(f, target)
                          imported += 1
                      relpath = os.path.relpath(target.as_posix(), dest_note.parent.as_posix()).replace(os.sep, "/")
                      grouped.setdefault(dest_note, []).append((target.suffix.lower(), relpath, target.name))

          updated_notes = 0
          for note, assets in grouped.items():
              text = note.read_text(encoding="utf-8")
              # Remove stale export placeholders now that the real files are present.
              lines = [line for line in text.splitlines() if "Notion-Anhang:" not in line]
              text = "\n".join(lines).rstrip()
              # Avoid adding a second media section on a repeat run.
              if "## Medien" in text:
                  text = text.split("## Medien", 1)[0].rstrip()
              assets = sorted(set(assets), key=lambda x: (x[0] == ".pdf", x[2].casefold()))
              block = ["", "", "## Medien", ""]
              for ext, relpath, name in assets:
                  safe = "<" + relpath.replace(">", "%3E") + ">"
                  if ext == ".pdf":
                      block.append(f"- [\u{0x1F4C4:04X} {name}]({safe})")
                  else:
                      block.append(f"![{name}]({safe})")
                      block.append("")
              note.write_text(text + "\n" + "\n".join(block).rstrip() + "\n", encoding="utf-8")
              updated_notes += 1

          print(f"Imported {imported} media files; linked {sum(map(len, grouped.values()))} assets across {updated_notes} notes.")
          if skipped:
              print("Unmatched media files (left in ZIPs, not copied):")
              print("\n".join(skipped))
          PY
      - name: Commit imported media
        run: |
          rm -f .github/workflows/import-notion-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Notion media into Lore and Phandelver"
            git push origin main
          fi
      - name: Trigger Quartz deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ElRayo23/Neuvia/actions/workflows/deploy-quartz.yml/dispatches \
            -d '{"ref":"main"}'
